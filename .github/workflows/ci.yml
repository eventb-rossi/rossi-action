name: CI

# No markdown file affects the scripts, the action or the fixtures, and a docs
# edit would otherwise build rossi from source on three runners.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE-*"]
  workflow_dispatch:

permissions: {}

# A superseded push should stop burning three release builds of rossi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh .github/rossi-test-wrapper.sh

  # The wrapper reads rossi's structured reports, so it is tested against rossi
  # built from source rather than against the last release: a contract change
  # breaks this job on the day it lands, not once a downstream repository
  # notices.
  wrapper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: eventb-rossi/rossi
          ref: main
          path: rossi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rossi
      # This job needs a working rossi, not a fast one, and rossi's release
      # profile is fat-LTO with one codegen unit — a near-serial link, paid on
      # three runners per push. Overridden here only; the shipping profile is
      # untouched.
      - name: Build rossi
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked --bin rossi --manifest-path rossi/Cargo.toml
      - name: Locate the binary
        id: bin
        shell: bash
        run: |
          path="rossi/target/release/rossi"
          [ "${RUNNER_OS}" = "Windows" ] && path="${path}.exe"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: A clean project passes
        id: clean
        uses: ./
        with:
          path: fixtures/clean-project
          rossi-path: ${{ steps.bin.outputs.path }}
          commands: validate,fmt-check,build
          deny-warnings: "true"
          sarif: "true"
          sarif-file: clean.sarif

      - name: A broken project is reported and located
        id: broken
        uses: ./
        env:
          ROSSI_REAL: ${{ steps.bin.outputs.path }}
          ROSSI_VALIDATE_LOG: ${{ runner.temp }}/broken-validate.log
        with:
          path: fixtures/broken-project
          rossi-path: .github/rossi-test-wrapper.sh
          sarif: "true"
          sarif-file: broken.sarif
          fail-on-error: "false"

      - name: A ruleless input failure is retained
        id: missing
        uses: ./
        env:
          ROSSI_REAL: ${{ steps.bin.outputs.path }}
          ROSSI_VALIDATE_LOG: ${{ runner.temp }}/missing-validate.log
        with:
          path: fixtures/does-not-exist.eventb
          rossi-path: .github/rossi-test-wrapper.sh
          sarif: "true"
          sarif-file: missing.sarif
          fail-on-error: "false"

      # Every step above asks for SARIF, so the JSON reader — the default
      # configuration, and the one most users get — would otherwise never run.
      - name: The default pass reads the JSON report
        id: plain
        uses: ./
        with:
          path: fixtures/broken-project
          rossi-path: ${{ steps.bin.outputs.path }}
          fail-on-error: "false"

      - name: Check what the action reported
        shell: bash
        env:
          PLAIN_VALID: ${{ steps.plain.outputs.valid }}
          PLAIN_ERRORS: ${{ steps.plain.outputs.error-count }}
          PLAIN_SARIF: ${{ steps.plain.outputs.sarif-file }}
          CLEAN_VALID: ${{ steps.clean.outputs.valid }}
          BROKEN_VALID: ${{ steps.broken.outputs.valid }}
          BROKEN_ERRORS: ${{ steps.broken.outputs.error-count }}
          MISSING_VALID: ${{ steps.missing.outputs.valid }}
          MISSING_ERRORS: ${{ steps.missing.outputs.error-count }}
          BROKEN_VALIDATE_LOG: ${{ runner.temp }}/broken-validate.log
          MISSING_VALIDATE_LOG: ${{ runner.temp }}/missing-validate.log
        run: |
          set -euo pipefail
          [ "$CLEAN_VALID" = "true" ] || { echo "clean project should pass"; exit 1; }
          [ "$BROKEN_VALID" = "false" ] || { echo "broken project should fail"; exit 1; }
          [ "$BROKEN_ERRORS" -ge 1 ] || { echo "broken project should report errors"; exit 1; }
          [ "$MISSING_VALID" = "false" ] || { echo "missing input should fail"; exit 1; }
          [ "$MISSING_ERRORS" = "1" ] || { echo "missing input should report one error"; exit 1; }
          # The JSON reader reaches the same verdict as the SARIF one, and
          # publishes no report when none was asked for.
          [ "$PLAIN_VALID" = "false" ] || { echo "broken project should fail without sarif"; exit 1; }
          [ "$PLAIN_ERRORS" = "$BROKEN_ERRORS" ] || { echo "json and sarif disagree on the count"; exit 1; }
          [ -z "$PLAIN_SARIF" ] || { echo "sarif-file should be empty when sarif is off"; exit 1; }
          [ "$(wc -l < "$BROKEN_VALIDATE_LOG" | tr -d ' ')" = "1" ]
          [ "$(wc -l < "$MISSING_VALIDATE_LOG" | tr -d ' ')" = "1" ]

          # One run per upload, whatever the input mix.
          [ "$(jq '.runs | length' broken.sarif)" = "1" ]
          # The finding is anchored to a path in the repository tree, with a
          # position — the whole point of the SARIF upload.
          jq -e '.runs[0].results[]
                 | select(.ruleId == "EB004")
                 | select(.locations[0].physicalLocation.artifactLocation.uri
                          == "fixtures/broken-project/Broken.eventb")
                 | select(.locations[0].physicalLocation.region.startLine == 7)' broken.sarif
          # The category the action passes to the upload step is recorded.
          [ "$(jq -r '.runs[0].automationDetails.id' broken.sarif)" = "rossi" ]
          jq -e '.runs[0].results[0]
                 | select(has("ruleId") | not)
                 | select(.level == "error")
                 | select(.message.text
                          == "File not found: fixtures/does-not-exist.eventb")
                 | select(.locations[0].physicalLocation.artifactLocation.uri
                          == "fixtures/does-not-exist.eventb")' missing.sarif

      # The gate covers the whole action, not just SARIF, so a plain run has to
      # be refused on the version alone.
      - name: Rossi before v0.1.8 is rejected
        id: old-rossi
        continue-on-error: true
        uses: ./
        env:
          ROSSI_REAL: ${{ steps.bin.outputs.path }}
          ROSSI_TEST_VERSION: 0.1.7
          ROSSI_VALIDATE_LOG: ${{ runner.temp }}/old-validate.log
        with:
          path: fixtures/clean-project
          rossi-path: .github/rossi-test-wrapper.sh

      - name: Check the version gate
        shell: bash
        env:
          OLD_ROSSI_OUTCOME: ${{ steps.old-rossi.outcome }}
          OLD_VALIDATE_LOG: ${{ runner.temp }}/old-validate.log
        run: |
          [ "$OLD_ROSSI_OUTCOME" = "failure" ]
          [ ! -e "$OLD_VALIDATE_LOG" ]

  # The download path — triple selection, checksum verification, PATH.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the latest rossi
        shell: bash
        run: bash scripts/install-rossi.sh
      - name: The installed binary runs
        shell: bash
        run: rossi --version

      # The wrapper job proves the contract against rossi's `main`; this proves
      # it against the release users actually get. `rossi-path` is the name on
      # PATH, so the action reuses the binary installed above instead of
      # downloading it a second time.
      - name: A clean project passes with the released binary
        id: released-clean
        uses: ./
        with:
          path: fixtures/clean-project
          rossi-path: rossi
          commands: validate,fmt-check,build
          deny-warnings: "true"
          sarif: "true"
          sarif-file: released-clean.sarif

      - name: A broken project is reported with the released binary
        id: released-broken
        uses: ./
        with:
          path: fixtures/broken-project
          rossi-path: rossi
          sarif: "true"
          sarif-file: released-broken.sarif
          fail-on-error: "false"

      - name: Check what the released binary reported
        shell: bash
        env:
          RAN_VERSION: ${{ steps.released-clean.outputs.rossi-version }}
          CLEAN_VALID: ${{ steps.released-clean.outputs.valid }}
          BROKEN_VALID: ${{ steps.released-broken.outputs.valid }}
          BROKEN_ERRORS: ${{ steps.released-broken.outputs.error-count }}
        run: |
          set -euo pipefail
          echo "action ran against rossi ${RAN_VERSION}"
          [ "$CLEAN_VALID" = "true" ] || { echo "clean project should pass"; exit 1; }
          [ "$BROKEN_VALID" = "false" ] || { echo "broken project should fail"; exit 1; }
          [ "$BROKEN_ERRORS" -ge 1 ] || { echo "broken project should report errors"; exit 1; }
          [ "$(jq '.runs | length' released-broken.sarif)" = "1" ]
          jq -e '.runs[0].results[]
                 | select(.ruleId == "EB004")
                 | select(.locations[0].physicalLocation.artifactLocation.uri
                          == "fixtures/broken-project/Broken.eventb")
                 | select(.locations[0].physicalLocation.region.startLine == 7)' released-broken.sarif

      - name: A release without a checksum manifest is refused
        shell: bash
        env:
          ROSSI_VERSION: "0.0.0-nonexistent"
        run: |
          set -euo pipefail
          if bash scripts/install-rossi.sh; then
            echo "installing an unverifiable release must fail"
            exit 1
          fi
